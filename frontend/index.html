<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="window">
        <div class="titlebar">File Explorer Simulator</div>

        <div class="toolbar">
            <button class="navbtn" id="backBtn" title="Back">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
            </button>
            <button class="navbtn" id="forwardBtn" title="Forward">
                <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
            <button class="navbtn" id="upBtn" title="Up">
                <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
            <div class="pathbar" id="pathbar">root</div>
        </div>

        <div class="actions">
            <button id="newFolderBtn">+ New Folder</button>
            <button id="newFileBtn">+ New File</button>
        </div>

        <div class="main">
            <div class="sidebar" id="tree"></div>
            <div class="items" id="items"></div>
        </div>

        <div class="menu" id="menu">
            <div id="renameOption">Rename</div>
            <div id="deleteOption">Delete</div>
        </div>

        <div class="statusbar" id="status">Connecting to server...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
